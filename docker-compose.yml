services:
  bot:
    image: serega-bot-images:${VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024"
    init: true
    mem_limit: 2048m
    mem_reservation: 512m
    shm_size: '512mb'
    stop_grace_period: 30s
    command: ["node", "src/main.ts"]
